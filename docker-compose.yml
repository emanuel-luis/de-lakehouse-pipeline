# Local Airflow 3.3.2 stack for the lakehouse DAG. Start with `make up` (creates the secrets in .env).
# LOCAL USE ONLY: the simple auth manager below makes every visitor an admin, no login.
name: de-lakehouse-pipeline

x-airflow-common: &airflow-common
  # The DAG, dbt project, manifest and pipeline venv are baked into the image (no bind mounts):
  # what CI and compose test is the image that would ship. Only airflow-init builds it; the other
  # services reuse it (several services building one tag in parallel fail on Docker Desktop).
  image: de-lakehouse-pipeline-airflow:local
  pull_policy: never
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # LocalExecutor runs tasks in the scheduler container; they reach the Execution API here.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://api-server:8080/execution/
    # Serves the scheduler's /health on port 8974 for its healthcheck.
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:?run make up to generate it}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?run make up to generate it}
    LAKEHOUSE_DATA_DIR: /opt/airflow/data
    LAKEHOUSE_DUCKDB_PATH: /opt/airflow/data/warehouse/lakehouse.duckdb
  volumes:
    - lakehouse-data:/opt/airflow/data
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    build:
      context: .
      dockerfile: airflow/Dockerfile
    # Rebuild on every `up`, so DAG and dbt edits always reach the image.
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command:
      - bash
      - -c
      - airflow db migrate && airflow pools set duckdb_writer 1 "DuckDB single writer"

  api-server:
    <<: *airflow-common
    command: api-server
    ports:
      # Loopback only: every visitor is an admin (see the header), so never publish it on the LAN.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  lakehouse-data:
