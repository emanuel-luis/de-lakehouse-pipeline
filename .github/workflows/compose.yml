name: compose

# Smoke test of the Airflow docker compose stack: build the image, start the stack, no DAG import
# errors, one `airflow dags test` run of lakehouse_pipeline, then one run driven by the scheduler.
# Heavy (minutes), so PRs trigger it only when they touch what goes into the image.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "airflow/**"
      - "dbt/**"
      - "src/**"
      - "uv.lock"
      - "docker-compose.yml"
      - ".github/workflows/compose.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"

jobs:
  compose:
    name: compose (stack up, import errors, dags test)
    runs-on: ubuntu-latest
    # Budget: build ~5 min, dags test ~15 min, scheduled run wait up to 32 min, teardown ~3 min.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # make up writes the JWT secret and Fernet key to .env (never printed) and runs
      # docker compose up -d --build --wait
      - name: make up
        run: make up
      # --wait covers container health, not the first parse of the DAG file: wait until the file
      # is in the metadata DB as a DAG or as an import error, so the next check sees a real result.
      - name: Wait for the first parse of lakehouse_pipeline.py
        run: |
          for _ in $(seq 1 24); do
            parsed="$(docker compose exec -T postgres psql -U airflow -d airflow -tAc \
              "select count(*) from dag where dag_id = 'lakehouse_pipeline'" || true)"
            [ "$parsed" = 1 ] && exit 0
            errors="$(docker compose exec -T scheduler airflow dags list-import-errors -o plain || true)"
            grep -q lakehouse_pipeline <<<"$errors" && exit 0
            sleep 5
          done
          echo "lakehouse_pipeline.py was not parsed within 120 s" >&2
          exit 1
      - name: No DAG import errors
        run: |
          out="$(docker compose exec -T scheduler airflow dags list-import-errors -o json)"
          echo "$out"
          # The CLI may print warnings (e.g. graphviz missing) before the result, so look for the
          # result line itself: an empty JSON list, or "No data found". Anything else fails.
          if ! printf '%s\n' "$out" | grep -qxE '\[\]|No data found'; then
            echo "DAG import errors found" >&2
            exit 1
          fi
      - name: airflow dags test lakehouse_pipeline
        run: docker compose exec -T scheduler airflow dags test lakehouse_pipeline
      # dags test runs every task in one process. This proves the real path: the scheduler queues
      # a scheduled run, LocalExecutor starts the tasks, and they call the Execution API on the
      # api-server service. Unpausing creates one run for the latest hourly interval.
      - name: One scheduler-driven run of lakehouse_pipeline
        run: |
          docker compose exec -T scheduler airflow dags unpause lakehouse_pipeline
          state=""
          # A local run took 1084 s before the Cosmos tasks skipped the per-call artifacts upload,
          # which saves about 2.6 s in each of 75 calls: projected ~900 s, so wait twice that.
          for _ in $(seq 1 192); do
            sleep 10
            # read the metadata DB: the Airflow CLI prints warnings on stdout around its JSON
            state="$(docker compose exec -T postgres psql -U airflow -d airflow -tAc \
              "select state from dag_run where dag_id = 'lakehouse_pipeline'
               and run_type = 'scheduled' order by id desc limit 1" || true)"
            echo "scheduled run state: ${state:-none yet}"
            case "$state" in success|failed) break ;; esac
          done
          docker compose exec -T scheduler airflow dags pause lakehouse_pipeline
          [ "$state" = success ] || { echo "the scheduled run did not succeed within 32 min" >&2; exit 1; }
      - name: Dump compose logs
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: make down
        if: always()
        run: make down
