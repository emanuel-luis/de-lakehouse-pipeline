name: ci

# Lint gates the rest. `test` runs the fast suite with the coverage gate; `pipeline` runs the whole
# demo (synthetic source -> landing -> dbt build -> summary) with no credentials.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  # per event: a push to main would otherwise cancel a weekly or manual run left pending
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"

jobs:
  lint:
    name: lint (ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: { python-version: "3.12" }
      - run: uv sync --locked
      - run: uv run --locked ruff check --output-format=github
      - run: uv run --locked ruff format --check
      - run: uv run --locked mypy

  test:
    name: test (pytest, coverage gate)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: { python-version: "3.12" }
      - run: uv sync --locked
      - run: uv run --locked pytest

  pipeline:
    name: pipeline (make demo on synthetic data)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: { python-version: "3.12" }
      - run: uv sync --locked
      - name: make demo
        run: make demo
        env:
          LAKEHOUSE_DATA_DIR: ${{ runner.temp }}/data
      - name: Upload dbt results and the ingest log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-run
          path: |
            dbt/target/run_results.json
            ${{ runner.temp }}/data/_meta
          if-no-files-found: warn
          retention-days: 7
