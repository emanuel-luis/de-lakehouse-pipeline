name: ci

# Lint gates the rest. `test` runs the fast suite with the coverage gate; `pipeline` runs the whole
# demo (synthetic source -> landing -> dbt build -> summary), the CDC demo and the slow end-to-end
# tests, with no credentials; `dags` runs the Airflow DAG integrity test (make dag-test); `site`
# builds the dbt docs, the Elementary report and a landing page (make site) and uploads them as
# the Pages artifact;
# `deploy-pages` publishes it, on pushes to main only. `diagrams` renders docs/diagrams/*.d2 with the
# pinned D2 and fails when a committed SVG is stale. The docker compose smoke test lives in
# compose.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  # per event: a push to main would otherwise cancel a weekly or manual run left pending
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"

jobs:
  lint:
    name: lint (ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: { python-version: "3.12" }
      - run: uv sync --locked
      - run: uv run --locked ruff check --output-format=github
      - run: uv run --locked ruff format --check
      - run: uv run --locked mypy

  test:
    name: test (pytest, coverage gate)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: { python-version: "3.12" }
      - run: uv sync --locked
      - run: uv run --locked pytest

  pipeline:
    name: pipeline (make demo, make cdc-demo, slow tests on synthetic data)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: { python-version: "3.12" }
      - run: uv sync --locked
      - name: make demo
        run: make demo
        env:
          LAKEHOUSE_DATA_DIR: ${{ runner.temp }}/data
      - name: make cdc-demo
        run: make cdc-demo
        env:
          LAKEHOUSE_DATA_DIR: ${{ runner.temp }}/data
      - name: slow end-to-end tests
        run: uv run --locked pytest -m slow --no-cov  # the coverage gate applies to the fast suite
        env:
          LAKEHOUSE_DATA_DIR: ${{ runner.temp }}/data
      - name: Upload dbt results and the ingest log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-run
          path: |
            dbt/target/run_results.json
            ${{ runner.temp }}/data/_meta
          if-no-files-found: warn
          retention-days: 7

  dags:
    name: dags (make dag-test, Airflow 3.3.2 + Cosmos 1.15.1)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: { python-version: "3.12" }
      - run: uv sync --locked
      # dag-test runs airflow-manifest first (dbt deps + parse), then the integrity test in a
      # throwaway Airflow venv under the 3.3.2 constraints, outside uv.lock
      - run: make dag-test

  diagrams:
    name: diagrams (D2 render check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # the pinned D2 release, checked against its sha256 in the Makefile
      - run: make d2-install
      - run: make diagrams-check
      - name: Upload the rendered SVGs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagrams
          path: docs/diagrams/*.svg
          if-no-files-found: warn
          retention-days: 7

  site:
    name: site (dbt docs, Elementary report, landing page)
    needs: [test, pipeline]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: { python-version: "3.12" }
      - run: uv sync --locked --group site
      - name: make cdc-demo
        run: make cdc-demo
        env:
          LAKEHOUSE_DATA_DIR: ${{ runner.temp }}/data
      - name: make site
        run: make site
        env:
          LAKEHOUSE_DATA_DIR: ${{ runner.temp }}/data
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy-pages:
    name: deploy-pages (GitHub Pages, main only)
    needs: site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
