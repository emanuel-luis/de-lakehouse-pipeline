# Monthly update PRs, one group per ecosystem for minor and patch: the SHA-pinned actions,
# uv.lock, the Dockerfile's uv image and the compose file's image tags. The Airflow base image is
# ignored on purpose: bump it by hand together with the `apache-airflow==` pin and the constraints
# URL in airflow/Dockerfile and the Makefile, which must name the same release.
# Semver-major version updates are ignored (majors move by hand) and a release waits 7 days
# before it is proposed. Security updates skip the schedule and the cooldown.
# .github/workflows/dependabot-auto-merge.yml merges these PRs once CI is green.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      github-actions: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      uv: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /airflow
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      docker: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: apache/airflow
  # `docker-compose` is a supported ecosystem value:
  # https://docs.github.com/en/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      docker-compose: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
